<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Slawi - Riyana Ajizah</title>
    
    <!-- Favicon Logo UGM -->
    <link rel="icon" type="image/png" href="images/LOGOUGM.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        /* Mengatur ukuran dasar halaman */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Mencegah scroll ganda di desktop */
        }
        
        /* Desain Header: 3 Kolom Sejajar Sempurna */
        .app-header {
            width: 100%;
            height: 65px;
            background: #ffffff;
            padding: 0 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            z-index: 1000;
            border-bottom: 3px solid #136ba1;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            white-space: nowrap;
        }

        .app-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-name {
            font-weight: 700;
            font-size: 14px;
            color: #136ba1;
        }

        .app-subtitle {
            font-size: 11px;
            color: #555;
        }

        /* Bagian Tengah: Judul Peta */
        .header-center {
            flex: 1.2;
            text-align: center;
            white-space: nowrap;
        }

        .map-main-title {
            font-weight: 700;
            font-size: 15px;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .map-sub-title {
            font-size: 11px;
            color: #7f8c8d;
        }

        /* Bagian Kanan: NIM & Matkul */
        .header-right {
            flex: 1;
            text-align: right;
            font-size: 12px;
            color: #2c3e50;
            line-height: 1.3;
            white-space: nowrap;
        }

        .header-right b {
            color: #136ba1;
        }

        /* Wadah Peta Mengisi Sisa Ruang */
        #map {
            width: 100%;
            flex: 1;
        }

        /* Desain Kustom untuk Popup */
        .leaflet-popup-content-wrapper {
            background: #ffffff;
            color: #2c3e50;
            border-radius: 8px;
            padding: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .leaflet-popup-content {
            margin: 12px 16px;
            font-size: 14px;
            line-height: 1.5;
            min-width: 180px;
        }
        .popup-title {
            font-weight: 700;
            font-size: 15px;
            color: #136ba1;
            margin-bottom: 8px;
            border-bottom: 2px solid #ebf5fb;
            padding-bottom: 6px;
            text-align: center;
        }
        .popup-row {
            display: flex;
            margin-bottom: 4px;
        }
        .popup-label {
            width: 55px;
            font-weight: bold;
        }
        .popup-separator {
            width: 15px;
            text-align: center;
        }
        .popup-value {
            flex: 1;
        }

        /* PENGATURAN RESPONSIF KHUSUS HP (MOBILE) */
        @media (max-width: 768px) {
            html, body {
                overflow: auto; /* Mengizinkan scroll di layar HP jika diperlukan */
            }
            .app-header {
                height: auto;
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 12px 10px;
                gap: 8px;
            }
            .header-left, .header-center, .header-right {
                width: 100%;
                text-align: center;
                white-space: normal;
                flex: unset;
            }
            .header-left {
                justify-content: center;
            }
            .app-subtitle {
                display: block; /* Memastikan sub-judul tetap tampil rapi di HP */
            }
            #map {
                height: calc(100vh - 140px); /* Menyesuaikan tinggi peta dengan header mobile */
            }
        }
    </style>
</head>
<body>

    <!-- Header Rapih Sejajar -->
    <header class="app-header">
        <div class="header-left">
            <img src="images/LOGOUGM.png" alt="Logo UGM" class="app-logo">
            <div class="app-title-group">
                <div class="app-name">Riyana Ajizah</div>
                <div class="app-subtitle">Magister Teknik Geomatika</div>
            </div>
        </div>
        
        <div class="header-center">
            <div class="map-main-title">Peta Slawi</div>
            <div class="map-sub-title">Kabupaten Tegal, Jawa Tengah</div>
        </div>

        <div class="header-right">
            <div>25/569731/PTK/16946</div>
            <div>Web Geospasial</div>
        </div>
    </header>

    <!-- Elemen untuk wadah peta -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Inisialisasi peta dengan pusat di Slawi, Kabupaten Tegal (-6.9859, 109.1402)
        var map = L.map('map', {
            center: [-6.9859, 109.1402],
            zoom: 13,
            minZoom: 10,
            maxZoom: 15
        });

        // Menambahkan background tile dari OpenStreetMap (OSM)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Membuat marker pada lokasi Slawi
        var marker = L.marker([-6.9859, 109.1402]).addTo(map);
        
        var popupContent = `
            <div class="popup-title"><b>Lokasi Peta</b></div>
            <div class="popup-row">
                <div class="popup-label">Kota</div>
                <div class="popup-separator">:</div>
                <div class="popup-value">Slawi, Kab. Tegal</div>
            </div>
            <div class="popup-row">
                <div class="popup-label">Nama</div>
                <div class="popup-separator">:</div>
                <div class="popup-value">Riyana Ajizah</div>
            </div>
        `;

        marker.bindPopup(popupContent).openPopup();
    </script>

</body>
</html>
